services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: passage
      POSTGRES_PASSWORD: passage
      POSTGRES_DB: passage
    ports:
      - "5434:5432"
    volumes:
      - passage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passage"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  passage_pgdata:
